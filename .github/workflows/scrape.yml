name: betman-scrape
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 배트맨 데이터 받기
        run: node scripts/scrape.js
      - name: 자동 분석
        run: node scripts/analyze.js
      - name: 저장
        run: |
          git config user.name "odds-lens-bot"
          git config user.email "odds-lens-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
