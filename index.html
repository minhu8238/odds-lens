<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181E" media="(prefers-color-scheme: dark)">
<title>ODDS LENS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#EEF1EE;--surface:#FFFFFF;--sunk:#F5F7F5;--ink:#151A21;--ink2:#3A414B;--mute:#6B727C;--faint:#A3A9B0;--line:#DDE2DD;
  --felt:#1D6A4E;--felt-bg:#E3F0E9;--amber:#B7791F;--amber-bg:#F7EEDC;--brick:#B0392A;--brick-bg:#F6E4E1;
  --r-lg:18px;--r-md:12px;--r-sm:8px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14181E;--surface:#1C2129;--sunk:#171B22;--ink:#EEF1F3;--ink2:#C9CFD6;--mute:#8C939C;--faint:#5C636C;--line:#2A3039;
  --felt:#4FB487;--felt-bg:#163428;--amber:#D9A653;--amber-bg:#33291A;--brick:#E2705F;--brick-bg:#3A201C;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.mrow:focus-visible{outline:2px solid var(--felt);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 80px}

/* 머리 */
.head{padding:22px 0 6px}
.brand{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mute)}
.round{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.rtitle{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.rtitle small{font-size:17px;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--ink2)}
.rmeta{text-align:right;font-size:13px;color:var(--mute);line-height:1.35}
.rmeta b{color:var(--ink);font-weight:600}
.rmeta .stale{color:var(--brick)}
.rswitch{display:flex;gap:6px;margin-top:14px}
.rswitch button{padding:6px 12px;border-radius:999px;font-size:13px;color:var(--mute);border:1px solid var(--line)}
.rswitch button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}

/* 필터 */
.filters{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid transparent;transition:border-color .2s}
.filters::-webkit-scrollbar{display:none}.filters.stuck{border-bottom-color:var(--line)}
.chip{flex:none;padding:7px 13px;border-radius:999px;font-size:14px;color:var(--ink2);background:var(--surface);border:1px solid var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

/* 판독 요약 */
.brief{margin-top:14px;background:var(--surface);border-radius:var(--r-lg);padding:18px 18px 8px}
.brief h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brief .counts{display:flex;gap:16px;margin-top:6px;font-size:13px;color:var(--mute)}
.brief .counts b{font-size:15px;font-weight:700;margin-right:3px}
.brief h3{margin:16px 0 4px;font-size:13px;font-weight:600;color:var(--mute)}
.pick{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.pick:first-of-type{border-top:0}
.pick .t{font-size:13px;color:var(--mute)}
.pick .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.pick .m small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.pick .s{text-align:right;line-height:1.2}
.pick .s b{font-size:18px;font-weight:800}
.pick .s small{display:block;font-size:12px;color:var(--mute)}
.none{font-size:14px;color:var(--faint);padding:6px 0 12px}

/* 시간 구분 */
.slot{margin:26px 0 8px;display:flex;align-items:baseline;gap:8px}
.slot b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.slot span{font-size:13px;color:var(--mute)}

/* 경기 블록 */
.match{position:relative;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 6px 20px;margin-top:10px;overflow:hidden}
.match::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:transparent}
.match.v-c::before{background:var(--felt)}.match.v-w::before{background:var(--amber)}.match.v-x::before{background:var(--brick)}
.match.past{opacity:.55}
.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.teams{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3;min-width:0}
.teams .vs{display:block;color:var(--ink2);font-weight:600}
.lg{font-size:12px;color:var(--mute);margin-bottom:2px}
.score{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
.mrow{display:grid;grid-template-columns:76px repeat(var(--k),1fr);gap:6px;align-items:start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-of-type{border-top:0}
.mlab{font-size:13px;color:var(--ink2);line-height:1.25;padding-top:3px}
.mlab small{display:block;color:var(--mute);font-size:12px}
.cell{border-radius:var(--r-sm);padding:4px 6px 5px;text-align:center}
.cell .sl{font-size:11px;color:var(--mute)}
.cell .od{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.cell .mv{font-size:11px;line-height:1.2;min-height:13px}
.cell .mv.dn{color:var(--felt)}.cell .mv.up{color:var(--brick)}
.cell .vt{font-size:11px;color:var(--faint)}
.cell.c{background:var(--felt-bg)}.cell.c .od{color:var(--felt)}
.cell.w{background:var(--amber-bg)}.cell.w .od{color:var(--amber)}
.cell.x .od{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--brick)}
.verdict{display:inline-block;margin-top:2px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.verdict.c{background:var(--felt);color:#fff}.verdict.w{background:var(--amber);color:#fff}.verdict.x{background:var(--brick-bg);color:var(--brick)}

/* 상세 */
.det{grid-column:1/-1;display:none;margin-top:8px;background:var(--sunk);border-radius:var(--r-md);padding:12px 12px 10px;font-size:13px;color:var(--ink2);cursor:default}
.mrow.open .det{display:block;animation:open .18s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mrow.open .det{animation:none}.filters{transition:none}}
.det h4{margin:12px 0 6px;font-size:13px;font-weight:700;color:var(--ink)}
.det h4:first-child{margin-top:0}
.det table{width:100%;border-collapse:collapse}
.det th{font-weight:500;color:var(--mute);font-size:12px;text-align:right;padding:3px 4px}
.det td{text-align:right;padding:3px 4px}
.det th:first-child,.det td:first-child{text-align:left;color:var(--mute)}
.det .pos{color:var(--felt);font-weight:600}.det .neg{color:var(--brick);font-weight:600}
.det .note{font-size:12px;color:var(--mute);margin-top:4px}
.flow{display:block;width:100%;height:96px;margin-top:2px}
.pair{margin:10px 0 4px;background:var(--sunk);border-radius:var(--r-md);padding:10px 12px}
.ph{font-size:13px;color:var(--ink2);margin-bottom:6px}.ph b{color:var(--ink)}.pn{display:block;font-size:11px;color:var(--mute)}
.pl{display:grid;grid-template-columns:repeat(var(--k),1fr);gap:6px;margin-top:6px}
.pc{background:var(--surface);border-radius:var(--r-sm);padding:5px 4px;text-align:center;line-height:1.2}
.pc span{display:block;font-size:11px;color:var(--mute)}.pc b{font-size:16px;font-weight:800}.pc small{display:block;font-size:11px;color:var(--faint)}
.pc.c{background:var(--felt-bg)}.pc.c b{color:var(--felt)}.pc.x{background:var(--brick-bg)}.pc.x b{color:var(--brick)}
.cmp{margin:10px 0 2px}.cbox{background:var(--sunk);border-radius:var(--r-md);margin-top:8px;overflow:hidden}
.copen{display:block;width:100%;text-align:left;padding:11px 12px;font-size:14px;font-weight:600;color:var(--ink)}.copen small{color:var(--mute);font-weight:400;margin-left:6px}
.ctabs{display:flex;gap:6px;padding:10px 10px 0}.ctabs button{flex:1;padding:7px 4px;border-radius:999px;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line)}
.ctabs button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.cflt{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 10px 0;font-size:11px;color:var(--mute)}.cflt span{margin-left:4px}.cflt span:first-child{margin-left:0}.cflt button{padding:4px 8px;border-radius:999px;font-size:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}.cflt button[aria-pressed=true]{background:var(--ink2);color:var(--paper);border-color:var(--ink2)}
.cres{padding:8px 12px 10px}.chead{font-size:14px}.chead small{display:block;color:var(--mute);font-size:11px}
.tally{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:13px}.tally b{font-weight:700}.tally small{color:var(--mute)}
.clist{margin-top:8px}.crow{background:var(--surface);border-radius:var(--r-sm);padding:7px 9px;margin-top:6px;font-size:12px}
.c1{color:var(--ink2);line-height:1.35}.c1 b{color:var(--ink);font-weight:600}.cd{color:var(--mute)}
.c2{display:grid;grid-template-columns:30px 1fr auto 40px;gap:6px;align-items:center;margin-top:3px}
.mk{color:var(--mute)}.ov{font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;column-gap:8px}.ov .o{white-space:nowrap}.ov .ch{font-weight:400;color:var(--mute)}.vp{color:var(--faint)}
.rs{text-align:center;border-radius:5px;padding:1px 0;font-weight:700;font-size:11px}
.rs.r0,.rs.r02{background:var(--felt-bg);color:var(--felt)}.rs.r1{background:var(--amber-bg);color:var(--amber)}.rs.r2,.rs.r12{background:var(--brick-bg);color:var(--brick)}
.more{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.match .extra{display:none}.match.showall .extra{display:grid}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.few{color:var(--brick);font-weight:600}

.empty{text-align:center;color:var(--mute);padding:48px 0}
.foot{margin-top:34px;font-size:12px;color:var(--mute);line-height:1.7}
.foot b{color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">ODDS LENS</div>
    <div class="round"><div class="rtitle" id="rtitle">—</div><div class="rmeta" id="rmeta">불러오는 중</div></div>
    <div class="rswitch" id="rswitch"></div>
  </div>
  <div class="filters" id="filters">
    <button class="chip" data-sp="">전체</button><button class="chip" data-sp="축구">축구</button><button class="chip" data-sp="농구">농구</button><button class="chip" data-sp="야구">야구</button><button class="chip" data-sp="배구">배구</button>
    <span class="sep"></span>
    <button class="chip" data-t="only">패턴 있는 경기</button><button class="chip" data-t="moved">배당 움직인 경기</button><button class="chip" data-t="past">끝난 경기 보기</button>
  </div>
  <section class="brief" id="brief"></section>
  <div id="list"></div>
  <div class="foot">
    배트맨 공식 데이터를 10분마다 자동으로 받아와요. 시장 줄을 누르면 배당 흐름이 열려요.<br>
    <b>비슷한 과거 경기</b>: 같은 경기의 일반+핸디(같은 기준점)를 함께 비교해요. <b>최종 + 변경 + 구매율</b>은 최종 배당 ±0.06, 배당 변경 유무 같음, 구매율 ±10%p(2way ±7%p). <b>초기→최종 무브</b>는 초기·최종 내재확률 ±3%p, 구매율 ±10%p(2way ±7%p). 직전 회차까지의 끝난 경기만 써요.
  </div>
</div>
<script>
const CFG={"soccer_normal_3":{"t":0.03,"pick":true,"avoid":true,"ll":true,"c":[1.1597,0.0389,-0.12089,-0.00653,0.0583,-0.03735,0.04453,0.04503,0.1929,0.08212]},"soccer_handicap_3":{"t":0.02,"pick":false,"avoid":true,"ll":true,"c":[1.12475,-0.01116,-0.16265,-0.0131,0.00777,0.03304,0.03192,0.02224,0.18602,0.05048]},"soccer_handicap_2":{"t":0.03,"pick":false,"avoid":true,"ll":true,"c":[1.21374,0.34084,-0.04488,0.0736,-0.13677,0.00353,0.26534,0.11444,-0.11705]},"soccer_ou_2":{"t":0.01,"pick":false,"avoid":false,"ll":false,"c":[]},"baseball_normal_2":{"t":0.03,"pick":false,"avoid":false,"ll":false,"c":[]},"baseball_handicap_2":{"t":0.02,"pick":false,"avoid":false,"ll":false,"c":[]},"baseball_ou_2":{"t":0.06,"pick":false,"avoid":true,"ll":true,"c":[0.88123,0.13153,0.25597,-0.0016,0.15663,0.00048,0.11505,0.07858,-0.0785]},"basketball_normal_2":{"t":0.02,"pick":false,"avoid":true,"ll":true,"c":[1.1522,0.07321,-0.11648,0.00385,0.03576,0.00216,-0.48468,-0.00096,0.00062]},"basketball_handicap_2":{"t":0.01,"pick":false,"avoid":false,"ll":true,"c":[0.69344,0.19123,-0.11604,0.00253,0.18673,-0.0002,0.05176,-0.00692,0.00701]},"basketball_ou_2":{"t":0.02,"pick":false,"avoid":false,"ll":true,"c":[-0.01026,-0.0027,0.12443,-4e-05,-0.0008,-0.0,-0.00064,0.0553,-0.05531]},"volleyball_normal_2":{"t":0.04,"pick":false,"avoid":false,"ll":false,"c":[]},"volleyball_handicap_2":{"t":0.06,"pick":false,"avoid":true,"ll":true,"c":[1.29866,0.76942,0.15505,0.02355,-0.03351,0.04792,-0.09765,0.01418,-0.01337]},"volleyball_ou_2":{"t":0.05,"pick":false,"avoid":false,"ll":false,"c":[]}};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let F=Object.assign({sp:'',only:false,moved:false,past:false},store.get('lens.f2',{}));
let DATA=null,AN={},CUR={SM:{},PM:{}},RI=0;const OPEN=new Set(),OPENM=new Set();
const sig=x=>1/(1+Math.exp(-x)),norm=a=>{const s=a.reduce((x,y)=>x+y,0);return a.map(x=>x/s)};
function predict(Fp,I,V,ch,rtp,w){const k=Fp.length,rd=(rtp-.86)*10,p=[];for(let j=0;j<k;j++){const lf=Math.log(Fp[j]/(1-Fp[j])),mv=Math.log(Fp[j]/I[j]),ht=V[j]-Fp[j];const x=[lf,mv,ht,mv*ht,mv*ch,ht*lf,rd*lf];for(let s=0;s<k;s++)x.push(s===j?1:0);let z=0;x.forEach((v,i)=>z+=v*w[i]);p.push(sig(z))}return norm(p)}
function mkey(sp,ty,k,bn){const S={축구:'soccer',야구:'baseball',농구:'basketball',배구:'volleyball'}[sp];if(!S||/홀짝|승N패|승\d패/.test(ty)||/전반|후반|이닝|쿼터|세트 /.test(bn||''))return null;let m=null;if(/승무패|승패/.test(ty)&&!/핸디/.test(ty))m='normal';else if(/핸디/.test(ty))m='handicap';else if(/언더오버/.test(ty))m='ou';return m?`${S}_${m}_${k}`:null}
// 엑셀식 판정: 같은 경기의 일반+핸디캡 짝(최종배당·변경유무·구매율, 핸디 기준점)이 비슷했던 과거 경기에서
// 어떤 결과가 배당 기대보다 유의미하게 자주(드물게) 나왔나. 좁게(±2%p·구매율 ±10%p) 10경기 이상이면 좁게, 아니면 넓게(±3%p·±15%p). 이항검정 p<0.05.
function buildPairs(gmTs){
  const SM={},PM={};const P=(AN&&AN.__pairs)||{};
  for(const [k,v] of Object.entries(P)){const [ts,ns,hs]=k.split(':').map(Number);if(ts!==gmTs)continue;
    if(v.novote){PM[ns]=PM[ns]||[];PM[ns].push({hs,ln:v.ln,novote:true});continue}
    const lv=v.strict&&v.strict.n>=10?'strict':'wide',x=v[lv];
    const e={hs,ns,ln:v.ln,lv,n:x.n,nrm:x.nrm,hdc:x.hdc,sn:v.strict?v.strict.n:0,wn:v.wide?v.wide.n:0};
    (PM[ns]=PM[ns]||[]).push(e);
    if(!SM[ns]||SM[ns].n<e.n)SM[ns]={s:x.nrm,n:x.n,lv};SM[hs]={s:x.hdc,n:x.n,lv}}
  return {SM,PM}}
function applySig(a){a.up=a.fo.map(()=>[]);a.dn=a.fo.map(()=>[]);a.mtags=a.tags.slice();a.mcls=a.cls;a.tags=a.fo.map(()=>'');a.cls='';a.best=0}
function analyze(g){
  const three=g.o[1]>0,pk=a=>three?a:[a[0],a[2]];
  const fo=pk(g.o);let io=g.i?pk(g.i):fo.slice();if(io.some(x=>!(x>1)))io=fo.slice();
  const vv=g.v?pk(g.v):null,vt=vv?vv.reduce((a,b)=>a+b,0):0;
  const Fp=norm(fo.map(x=>1/x)),I=norm(io.map(x=>1/x)),V=vt>=50?norm(vv):null,rtp=1/fo.reduce((a,x)=>a+1/x,0);
  const isH=/핸디/.test(g.ty),isO=/언더오버/.test(g.ty);
  const isS=/홀짝/.test(g.ty);const lab=three?(isH?['핸승','핸무','핸패']:['승','무','패']):(isO?['언더','오버']:isS?['홀','짝']:isH?['핸승','핸패']:['승','패']);
  const key=mkey(g.sp,g.ty,fo.length,g.bn),c=key&&CFG[key];let P=null,E=null,tags=fo.map(()=>''),cls='n';
  if(c&&c.ll){P=predict(Fp,I,V||Fp,Math.min(g.c,3),rtp,c.c);E=P.map((p,j)=>(p-Fp[j])*100);const t=c.t*100;
    tags=E.map(e=>e>=t&&c.pick?'c':e>=t-1&&e>=1&&c.pick?'w':e<=-2&&c.avoid?'x':'');
    cls=tags.includes('c')?'c':tags.includes('w')?'w':tags.includes('x')?'x':''}
  const best=tags.indexOf('c')>=0?tags.indexOf('c'):tags.indexOf('w');
  return {fo,io,Fp,V,P,E,lab,tags,cls,rtp,three,isH,isO,best}}
const pad=n=>String(n).padStart(2,'0');
const hhmm=ms=>{const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayKey=ms=>{const d=new Date(ms);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const dtmMs=s=>s?new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12)).getTime():0;

const pk3=(o,three)=>three?o:[o[0],o[2]];
const nzp=a=>{const inv=a.map(x=>1/x),s=inv.reduce((p,q)=>p+q,0);return inv.map(x=>x/s)};

  const qh={f:pk3(H.o,h3),i:pk3(H.i&&H.i.every((x,j)=>x>1||(!h3&&j===1))?H.i:H.o,h3),m:(H.c||0)>0,v:vpct(H.v)&&pk3(vpct(H.v),h3)};

  const cols=a.three?['var(--felt)','var(--faint)','var(--brick)']:['var(--felt)','var(--brick)'];
  const X=i=>pad+i*(W-2*pad)/(D.length-1),Y=v=>pad+(1-(v-mn)/rng)*(H-2*pad);
  const paths=`<line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="3 3"/>`+a.fo.map((_,j)=>{let d='';D.forEach((p,i)=>{d+=(i?` H${X(i).toFixed(1)} V${Y(p[j]).toFixed(1)}`:`M${X(0).toFixed(1)} ${Y(p[j]).toFixed(1)}`)});return `<path d="${d}" fill="none" stroke="${cols[j]}" stroke-width="2" stroke-linejoin="round"/>`}).join('');
  const times=['처음'].concat(g.ch.map(c=>`${+c[0].slice(6,8)}일 ${c[0].slice(8,10)}:${c[0].slice(10,12)}`));
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="배당 확률 흐름">${paths}</svg>
  <div class="legend">${a.lab.map((l,j)=>`<span><i style="background:${cols[j]}"></i>${l}</span>`).join('')}<span style="margin-left:auto">처음 대비 확률 변화 ±${(amp*100).toFixed(1)}%p</span></div>
  <table style="margin-top:6px"><tr><th>시각</th>${a.lab.map(l=>`<th>${l}</th>`).join('')}</tr>${pts.map((p,i)=>`<tr><td>${times[i]}</td>${p.map(v=>`<td>${v.toFixed(2)}</td>`).join('')}</tr>`).join('')}</table>`}
function simBlock(title,desc,s,a){
  if(!s)return `<h4>${title}</h4><div class="note">${desc} · 구매율 정보가 없어 비교하지 않았어요.</div>`;
  if(!s.n)return `<h4>${title}</h4><div class="note">${desc} · 비슷한 경기가 없어요.</div>`;
  const ok=j=>s.dA&&s.dB&&s.nA>=10&&s.nB>=10&&Math.sign(s.dA[j])===Math.sign(s.dB[j])&&Math.abs(s.act[j]-s.exp[j])>=1;
  return `<h4>${title} <span style="font-weight:500;color:var(--mute)">${s.n.toLocaleString()}경기</span>${s.n<30?' <span class="few">표본 적음</span>':''}</h4><div class="note" style="margin-top:-4px">${desc} · ~2022 ${s.nA}, 2023~ ${s.nB}</div>
  <table><tr><th></th>${a.lab.map(l=>`<th>${l}</th>`).join('')}</tr><tr><td>실제</td>${s.act.map(v=>`<td>${v.toFixed(1)}%</td>`).join('')}</tr><tr><td>배당 기대</td>${s.exp.map(v=>`<td>${v.toFixed(1)}%</td>`).join('')}</tr><tr><td>차이</td>${s.act.map((v,j)=>{const d=v-s.exp[j];return `<td class="${ok(j)?(d>0?'pos':'neg'):''}">${sgn(d)}${ok(j)?'*':''}</td>`}).join('')}</tr>${s.pu?`<tr><td>우연일 확률</td>${s.pu.map((q,j)=>{const v=s.act[j]>=s.exp[j]?q:s.pd[j];const sg=v<0.05&&s.n>=10;return `<td class="${sg?(s.act[j]>=s.exp[j]?'pos':'neg'):''}">${v<0.001?'<0.1':(v*100).toFixed(v<0.1?1:0)}%</td>`}).join('')}</tr>`:''}</table>`}
function detHTML(x){
  const {g,a,sim}=x;let h='<h4>배당 흐름</h4>'+flowSVG(g,a);
  if(sim){const t=a.three?'2':'1.5',v=a.three?'10':'7';
    h+=simBlock('비슷한 배당 무브',`초기·최종 확률 ±${t}%p, 움직임 방향과 변경 여부 일치`,sim.atlas,a)+simBlock('무브 + 구매율',`무브에 구매율 ±${v}%p`,sim.atlasV,a)+simBlock('최종 배당만',`최종 배당 확률 ±1%p`,sim.fin,a);
    h+='<div class="note" style="margin-top:8px">같은 시장·같은 기준점, 직전 회차까지의 경기만 비교해요. 초록·빨강 숫자는 10경기 이상이고 우연일 확률 5% 미만인 결과, *는 두 기간 모두 같은 방향.</div>'}
  h+='<h4>참고: 정배 보정 모델</h4>'+(a.P?`<table><tr><th></th>${a.lab.map(l=>`<th>${l}</th>`).join('')}</tr><tr><td>배당 확률</td>${a.Fp.map(v=>`<td>${(v*100).toFixed(1)}%</td>`).join('')}</tr><tr><td>모델 확률</td>${a.P.map(v=>`<td>${(v*100).toFixed(1)}%</td>`).join('')}</tr><tr><td>우위</td>${a.E.map((e,j)=>`<td class="${a.mtags[j]==='x'?'neg':a.mtags[j]?'pos':''}">${sgn(e)}</td>`).join('')}</tr></table><div class="note">환급률 ${(a.rtp*100).toFixed(1)}%</div>`:`<div class="note">이 시장은 모델이 배당보다 나은 예측을 하지 못해서 판정하지 않아요. 환급률 ${(a.rtp*100).toFixed(1)}%</div>`);
  return h}
document.getElementById('rswitch').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;RI=+b.dataset.i;draw()});
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.sp!==undefined)F.sp=b.dataset.sp;else F[b.dataset.t]=!F[b.dataset.t];store.set('lens.f2',F);draw()});
const toggle=el=>{if(!el)return;const s=+el.dataset.s;OPEN.has(s)?OPEN.delete(s):OPEN.add(s);el.classList.toggle('open');el.setAttribute('aria-expanded',el.classList.contains('open'))};
document.getElementById('list').addEventListener('click',e=>{
  const cb=e.target.closest('.cbox');
  if(cb){const key=cb.dataset.key;
    if(e.target.closest('[data-open]')){CMP[key]={mode:'fin',shown:30};cb.outerHTML=compareShellOne(cb);const nb=document.querySelector(`.cbox[data-key="${key}"]`);runCompare(nb);return}
    const mb=e.target.closest('[data-mode]');if(mb){CMP[key].mode=mb.dataset.mode;CMP[key].shown=30;cb.outerHTML=compareShellOne(cb);runCompare(document.querySelector(`.cbox[data-key="${key}"]`));return}
    const fb=e.target.closest('.cflt [data-k]');if(fb){const st=CMP[key];st[fb.dataset.k]=fb.dataset.k==='chg'?fb.dataset.v==='1':+fb.dataset.v;st.shown=30;cb.outerHTML=compareShellOne(cb);runCompare(document.querySelector(`.cbox[data-key="${key}"]`));return}
    if(e.target.closest('[data-more-list]')){CMP[key].shown+=50;runCompare(cb);return}
    return}
  if(e.target.closest('.det'))return;const mb=e.target.closest('[data-more]');if(mb){const art=mb.closest('.match'),k=art.dataset.m;OPENM.has(k)?OPENM.delete(k):OPENM.add(k);art.classList.toggle('showall');mb.textContent=art.classList.contains('showall')?'다른 시장 접기':mb.textContent;if(!art.classList.contains('showall'))draw();return}toggle(e.target.closest('.mrow'))});
document.getElementById('list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('mrow')){e.preventDefault();toggle(e.target)}});
document.getElementById('brief').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b)return;const s=+b.dataset.s;OPEN.add(s);F.sp='';F.only=false;F.moved=false;store.set('lens.f2',F);draw();const el=document.querySelector(`.mrow[data-s="${s}"]`);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})});
const fl=document.getElementById('filters');new IntersectionObserver(([e])=>fl.classList.toggle('stuck',e.intersectionRatio<1),{threshold:[1],rootMargin:'-1px 0px 0px 0px'}).observe(fl);
load();setInterval(load,120000);setInterval(()=>{if(DATA)draw()},60000);
</script>
