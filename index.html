<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>ODDS LENS LIVE</title>
<style>
:root{--bg:#0e1013;--card:#171a1f;--line:#262a31;--tx:#e9ebef;--mut:#8b919c;--acc:#d9b26a;--good:#5fc48f;--bad:#e06c6c;--mid:#9aa3b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 60px}
header{position:sticky;top:0;z-index:3;background:rgba(14,16,19,.97);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px}.brand b{color:var(--acc)}
.upd{font-size:12px;color:var(--mut)}.upd.old{color:var(--bad)}
.bar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;background:#1f232a;border:1px solid var(--line);color:var(--mid);padding:6px 11px;border-radius:999px;font:inherit;font-size:13px}
.bar button.on{background:var(--acc);color:#14110a;border-color:var(--acc);font-weight:700}
.sum{display:flex;gap:6px;margin:12px 0 4px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.sum b{color:var(--tx)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}
.g.c{border-color:var(--acc)}.g.x{border-color:#4a2626}.g.done{opacity:.55}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.tm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#242830;color:var(--mid)}
.tg.c{background:var(--acc);color:#14110a}.tg.w{background:#3a3220;color:var(--acc)}.tg.x{background:#3a1f1f;color:#f0a0a0}.tg.n{background:none;color:#5d636c;font-weight:500}
.odds{display:grid;gap:6px;margin-top:9px}
.odds div{background:#0f1216;border-radius:10px;padding:7px 4px;text-align:center;position:relative}
.odds small{display:block;font-size:11px;color:var(--mut)}
.odds b{font-size:16px;font-variant-numeric:tabular-nums}
.odds .mv{font-size:11px;margin-right:4px}.dn{color:var(--good)}.up{color:var(--bad)}
.odds .vt{font-size:11px;color:var(--mut)}
.odds div.hl{outline:1.5px solid var(--acc)}.odds div.av{outline:1.5px solid #6a3030}
.det{display:none;margin-top:9px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--mid)}
.g.open .det{display:block}
.det table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.det td,.det th{padding:3px 2px;text-align:center}.det th{color:var(--mut);font-weight:500}
.pos{color:var(--good)}.neg{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.foot{color:var(--mut);font-size:11px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><div class="brand">ODDS <b>LENS</b> LIVE</div><div class="upd" id="upd">불러오는 중…</div></div>
  <div class="bar" id="rd"></div>
  <div class="bar" id="flt">
    <button data-k="sp" data-v="" class="on">전체</button><button data-k="sp" data-v="축구">축구</button><button data-k="sp" data-v="야구">야구</button><button data-k="sp" data-v="농구">농구</button><button data-k="sp" data-v="배구">배구</button>
    <button data-k="only" id="bOnly">판정 있는 것만</button><button data-k="moved" id="bMoved">배당 움직인 것</button><button data-k="hide" id="bHide" class="on">시작 경기 숨김</button>
  </div>
</header>
<div class="sum" id="sum"></div>
<div id="list"></div>
<div class="foot">
배트맨 공식 데이터를 10분마다 자동으로 받아와요(GitHub 사정에 따라 늦어질 수 있음). 카드를 누르면 배당 변경 이력과 모델 수치가 나와요.<br>
판정: <b style="color:var(--acc)">후보</b>는 축구 일반만 실전 검증 통과(2024~ ROI −6.3%, 아무거나 −15.5%). <b style="color:#f0a0a0">피하기</b>는 6개 시장 검증(해당 쪽 −20~−34%). 그 밖의 시장은 판정 없음. 어떤 등급도 기대 ROI는 마이너스예요. 구매율은 구매 건수 기준.
</div>
</div>
<script>
const CFG={"soccer_normal_3":{"t":0.03,"pick":true,"avoid":true,"ll":true,"c":[1.1597,0.0389,-0.12089,-0.00653,0.0583,-0.03735,0.04453,0.04503,0.1929,0.08212]},"soccer_handicap_3":{"t":0.02,"pick":false,"avoid":true,"ll":true,"c":[1.12475,-0.01116,-0.16265,-0.0131,0.00777,0.03304,0.03192,0.02224,0.18602,0.05048]},"soccer_handicap_2":{"t":0.03,"pick":false,"avoid":true,"ll":true,"c":[1.21374,0.34084,-0.04488,0.0736,-0.13677,0.00353,0.26534,0.11444,-0.11705]},"soccer_ou_2":{"t":0.01,"pick":false,"avoid":false,"ll":false,"c":[]},"baseball_normal_2":{"t":0.03,"pick":false,"avoid":false,"ll":false,"c":[]},"baseball_handicap_2":{"t":0.02,"pick":false,"avoid":false,"ll":false,"c":[]},"baseball_ou_2":{"t":0.06,"pick":false,"avoid":true,"ll":true,"c":[0.88123,0.13153,0.25597,-0.0016,0.15663,0.00048,0.11505,0.07858,-0.0785]},"basketball_normal_2":{"t":0.02,"pick":false,"avoid":true,"ll":true,"c":[1.1522,0.07321,-0.11648,0.00385,0.03576,0.00216,-0.48468,-0.00096,0.00062]},"basketball_handicap_2":{"t":0.01,"pick":false,"avoid":false,"ll":true,"c":[0.69344,0.19123,-0.11604,0.00253,0.18673,-0.0002,0.05176,-0.00692,0.00701]},"basketball_ou_2":{"t":0.02,"pick":false,"avoid":false,"ll":true,"c":[-0.01026,-0.0027,0.12443,-4e-05,-0.0008,-0.0,-0.00064,0.0553,-0.05531]},"volleyball_normal_2":{"t":0.04,"pick":false,"avoid":false,"ll":false,"c":[]},"volleyball_handicap_2":{"t":0.06,"pick":false,"avoid":true,"ll":true,"c":[1.29866,0.76942,0.15505,0.02355,-0.03351,0.04792,-0.09765,0.01418,-0.01337]},"volleyball_ou_2":{"t":0.05,"pick":false,"avoid":false,"ll":false,"c":[]}};
const st={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let F=st.get('lensLive.f',{sp:'',only:false,moved:false,hide:true}),DATA=null,RI=0,OPEN=new Set();
const sig=x=>1/(1+Math.exp(-x)),norm=a=>{const s=a.reduce((x,y)=>x+y,0);return a.map(x=>x/s)};
function predict(Fp,I,V,ch,rtp,w){const k=Fp.length,rd=(rtp-.86)*10,p=[];for(let j=0;j<k;j++){const lf=Math.log(Fp[j]/(1-Fp[j])),mv=Math.log(Fp[j]/I[j]),ht=V[j]-Fp[j];const x=[lf,mv,ht,mv*ht,mv*ch,ht*lf,rd*lf];for(let s=0;s<k;s++)x.push(s===j?1:0);let z=0;x.forEach((v,i)=>z+=v*w[i]);p.push(sig(z))}return norm(p)}
function mkey(sp,ty,k){const S={축구:'soccer',야구:'baseball',농구:'basketball',배구:'volleyball'}[sp];if(!S||/홀짝|승N패|승\d패/.test(ty))return null;
  let m=null;if(/승무패|승패/.test(ty)&&!/핸디/.test(ty))m='normal';else if(/핸디/.test(ty))m='handicap';else if(/언더오버/.test(ty))m='ou';return m?`${S}_${m}_${k}`:null}
function analyze(g){
  const three=g.o[1]>0,pick=a=>three?a:[a[0],a[2]];
  const fo=pick(g.o);let io=g.i?pick(g.i):fo.slice();if(io.some(x=>!(x>1)))io=fo.slice();
  const vv=g.v?pick(g.v):null,vt=vv?vv.reduce((a,b)=>a+b,0):0;
  const Fp=norm(fo.map(x=>1/x)),I=norm(io.map(x=>1/x)),V=vt>=50?norm(vv):null,rtp=1/fo.reduce((a,x)=>a+1/x,0);
  const lab=three?(/핸디/.test(g.ty)?['핸승','핸무','핸패']:['승','무','패']):(/언더오버/.test(g.ty)?['언더','오버']:/핸디/.test(g.ty)?['핸승','핸패']:['승','패']);
  const key=mkey(g.sp,g.ty,fo.length),c=key&&CFG[key];let P=null,E=null,tags=fo.map(()=>''),verdict='판정 없음',cls='n';
  if(c&&c.ll){P=predict(Fp,I,V||Fp,Math.min(g.c,3),rtp,c.c);E=P.map((p,j)=>(p-Fp[j])*100);const t=c.t*100;
    tags=E.map(e=>e>=t&&c.pick?'c':e>=t-1&&e>=1&&c.pick?'w':e<=-2&&c.avoid?'x':'');
    const ci=tags.indexOf('c'),wi=tags.indexOf('w'),xs=tags.map((x,j)=>x==='x'?lab[j]:null).filter(Boolean);
    if(ci>=0){verdict=lab[ci]+' 후보';cls='c'}else if(wi>=0){verdict=lab[wi]+' 관심';cls='w'}else if(xs.length){verdict=xs.join('·')+' 피하기';cls='x'}else{verdict='패스';cls=''}}
  return {fo,io,Fp,V,P,E,lab,tags,verdict,cls,rtp,three}}
const pad=n=>String(n).padStart(2,'0');
const hm=ms=>{const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dtm=s=>s?`${+s.slice(4,6)}/${+s.slice(6,8)} ${s.slice(8,10)}:${s.slice(10,12)}`:'';
function ago(ms){const m=Math.round((Date.now()-ms)/60000);return m<1?'방금':m<60?`${m}분 전`:`${Math.floor(m/60)}시간 ${m%60}분 전`}
async function load(){
  try{const r=await fetch('data/latest.json?'+Date.now());if(!r.ok)throw r.status;DATA=await r.json();if(RI>=DATA.rounds.length)RI=0;draw()}
  catch(e){document.getElementById('upd').textContent='데이터 없음 ('+e+')';document.getElementById('list').innerHTML='<div class="empty">아직 받아온 데이터가 없어요. 첫 자동 실행을 기다려 주세요.</div>'}}
function draw(){
  const u=document.getElementById('upd');u.textContent='갱신 '+ago(DATA.updated);u.classList.toggle('old',Date.now()-DATA.updated>45*60000);
  const SN={SaleIng:'판매중',SaleBefore:'판매 전',SaleComplete:'마감'};
  document.getElementById('rd').innerHTML=DATA.rounds.map((r,i)=>`<button data-i="${i}" class="${i===RI?'on':''}">${r.gmTs%10000}회차 · ${SN[r.saleStatus]||r.saleStatus||''}</button>`).join('');
  document.querySelectorAll('#flt button').forEach(b=>{const k=b.dataset.k;b.classList.toggle('on',k==='sp'?F.sp===b.dataset.v:!!F[k])});
  const R=DATA.rounds[RI],now=Date.now();
  const rows=R.games.map(g=>({g,a:analyze(g)}));
  const vis=rows.filter(({g,a})=>(!F.sp||g.sp===F.sp)&&(!F.only||a.cls!=='n'&&a.cls!=='')&&(!F.moved||g.c>0)&&(!F.hide||g.t>now)).sort((x,y)=>x.g.t-y.g.t||x.g.s-y.g.s);
  const cnt=k=>rows.filter(x=>x.a.cls===k&&x.g.t>now).length;
  document.getElementById('sum').innerHTML=`<span>표시 <b>${vis.length}</b> / ${R.games.length}</span><span>· 남은 경기 중 후보 <b style="color:var(--acc)">${cnt('c')}</b> · 관심 <b>${cnt('w')}</b> · 피하기 <b style="color:#f0a0a0">${cnt('x')}</b></span>`;
  document.getElementById('list').innerHTML=vis.length?vis.map(({g,a})=>card(g,a,now)).join(''):'<div class="empty">조건에 맞는 경기가 없어요.</div>';
}
function card(g,a,now){
  const line=/핸디|언더오버/.test(g.ty)&&g.ln!==0?` <b style="color:var(--tx)">${g.ln>0&&/핸디/.test(g.ty)?'+':''}${g.ln}</b>`:'';
  const k=a.fo.length;
  const cells=a.fo.map((o,j)=>{const d=o-a.io[j];const mv=Math.abs(d)>=0.005?`<span class="mv ${d<0?'dn':'up'}">${a.io[j].toFixed(2)}${d<0?'▼':'▲'}</span>`:'';
    return `<div class="${a.tags[j]==='c'||a.tags[j]==='w'?'hl':a.tags[j]==='x'?'av':''}"><small>${a.lab[j]}</small>${mv}<b>${o.toFixed(2)}</b><div class="vt">${a.V?'구매 '+(a.V[j]*100).toFixed(0)+'%':'&nbsp;'}</div></div>`}).join('');
  const hist=g.ch&&g.ch.length?`<table><tr><th>변경 시각</th>${a.lab.map(l=>`<th>${l}</th>`).join('')}</tr><tr><td>처음</td>${a.io.map(x=>`<td>${x.toFixed(2)}</td>`).join('')}</tr>${g.ch.map(c=>{const o=a.three?[c[1],c[2],c[3]]:[c[1],c[3]];return `<tr><td>${dtm(c[0])}</td>${o.map(x=>`<td>${x.toFixed(2)}</td>`).join('')}</tr>`}).join('')}</table>`:'배당 변경 없음';
  const model=a.P?`<div style="margin-top:6px">배당 확률 ${a.Fp.map(x=>(x*100).toFixed(1)).join(' / ')} → 모델 ${a.P.map(x=>(x*100).toFixed(1)).join(' / ')} · 우위 ${a.E.map((e,j)=>`<span class="${a.tags[j]==='x'?'neg':a.tags[j]?'pos':''}">${e>0?'+':''}${e.toFixed(1)}</span>`).join(' / ')}%p</div>`:'<div style="margin-top:6px">이 시장은 모델이 배당을 이기지 못해 판정하지 않아요.</div>';
  const res=g.t<now&&g.sc&&g.res!=null?` · 결과 ${g.sc}`:'';
  return `<div class="g ${a.cls==='c'?'c':a.cls==='x'?'x':''} ${g.t<now?'done':''} ${OPEN.has(g.s)?'open':''}" data-s="${g.s}">
  <div class="r1"><span>${hm(g.t)} · ${g.lg||''} · ${g.ty}${line}</span><span>${g.c?`변경 ${g.c}회 · ${dtm(g.lc).split(' ')[1]}`:''}</span></div>
  <div class="r2"><div class="tm">${g.h} <span style="color:var(--mut);font-weight:400">vs</span> ${g.a}</div><span class="tg ${a.cls}">${a.verdict}</span></div>
  <div class="odds" style="grid-template-columns:repeat(${k},1fr)">${cells}</div>
  <div class="det">${hist}${model}<div style="margin-top:4px">환급률 ${(a.rtp*100).toFixed(1)}%${res}</div></div></div>`}
document.getElementById('rd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;RI=+b.dataset.i;draw()});
document.getElementById('flt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;if(k==='sp')F.sp=b.dataset.v;else F[k]=!F[k];st.set('lensLive.f',F);draw()});
document.getElementById('list').addEventListener('click',e=>{const c=e.target.closest('.g');if(!c)return;const s=+c.dataset.s;OPEN.has(s)?OPEN.delete(s):OPEN.add(s);c.classList.toggle('open')});
load();setInterval(load,120000);setInterval(()=>DATA&&(document.getElementById('upd').textContent='갱신 '+ago(DATA.updated)),30000);
</script>
</body>
</html>
